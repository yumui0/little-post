<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<script>try { const t = localStorage.getItem("lp-theme"); if (t === "dark" || t === "light") document.documentElement.dataset.theme = t; } catch (e) {}</script>
	<script>(() => { let l = ""; try { l = localStorage.getItem("lp-lang") || ""; } catch (e) {} if (l !== "fr" && l !== "en") l = /^fr/i.test(navigator.language || "") ? "fr" : "en"; document.documentElement.lang = l; })();</script>
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>My account – Little Post</title>
	<meta name="description" content="Your Little Post cards, orders and favourites.">
	<meta name="robots" content="noindex">
	<meta name="theme-color" content="#fff7ec">
	<link rel="icon" href="res/favicon.svg" type="image/svg+xml">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Gaegu:wght@400;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="css/common.css">
	<link rel="stylesheet" href="css/shop.css">
	<link rel="stylesheet" href="css/site.css">
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header id="siteHeader"></header>

<main id="main">
	<div id="acctGate"><div class="loading">Opening your account…</div></div>
	<div id="acct" hidden>
		<div class="acct-head">
			<div><h1 id="hello">My account</h1><p id="who"></p></div>
			<button class="btn soft" type="button" id="logout">Log out</button>
		</div>
		<nav class="acct-tabs" id="tabs" aria-label="Account sections">
			<a href="#overview" data-tab="overview">Overview</a>
			<a href="#cards" data-tab="cards">My cards</a>
			<a href="#orders" data-tab="orders">Orders</a>
			<a href="#favorites" data-tab="favorites">Favourites</a>
			<a href="#drafts" data-tab="drafts">Drafts</a>
			<a href="#settings" data-tab="settings">Settings</a>
		</nav>
		<section class="panel" id="panel" aria-live="polite"></section>
	</div>
</main>

<footer id="siteFooter"></footer>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="js/i18n.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="js/config.js"></script>
<script src="path.js"></script>
<script src="js/app.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js" defer></script>
<script src="js/account.js"></script>
</body>
</html>
