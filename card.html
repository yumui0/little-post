<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<script>try { const t = localStorage.getItem("lp-theme"); if (t === "dark" || t === "light") document.documentElement.dataset.theme = t; } catch (e) {}</script>
	<script>(() => { let l = ""; try { l = localStorage.getItem("lp-lang") || ""; } catch (e) {} if (l !== "fr" && l !== "en") l = /^fr/i.test(navigator.language || "") ? "fr" : "en"; document.documentElement.lang = l; })();</script>
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>You've got a card</title>
	<meta name="theme-color" content="#fff0f4">
	<link rel="icon" href="res/favicon.svg" type="image/svg+xml">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Gaegu:wght@400;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="css/common.css">
	<link rel="stylesheet" href="css/card.css">
</head>
<body>
	<main class="scene" id="scene">
		<p class="hello" id="hello">Opening your card…</p>

		<div class="stage" id="stage" hidden>
			<div class="book" id="book">
				<div class="inside" id="inside" translate="no">
					<p class="to" id="uname"></p>
					<p class="msg" id="utext"></p>
					<p class="from" id="ufrom"></p>
				</div>
				<button class="cover" id="cover" type="button" aria-expanded="false" aria-label="Open your card">
					<span class="face front"><span class="cover-art" id="front"></span></span>
					<span class="face back" id="back" aria-hidden="true"></span>
				</button>
			</div>
		</div>

		<p class="tap" id="tap" hidden>Tap the card to open it</p>

		<div class="after" id="after" hidden>
			<a class="btn" href="shop.html">Send a card back</a>
		</div>

		<div class="oops" id="oops" hidden>
			<h1>This card link looks broken</h1>
			<p>Some of the link may have been cut off when it was shared. Ask the sender for a fresh link, or send a card of your own.</p>
			<a class="btn" href="index.html">Visit Little Post</a>
		</div>
	</main>
	<div class="confetti" id="confetti" aria-hidden="true"></div>

	<script src="js/i18n.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
	<script src="js/config.js"></script>
	<script src="path.js"></script>
	<script src="js/app.js"></script>
	<script src="js/card.js"></script>
</body>
</html>
