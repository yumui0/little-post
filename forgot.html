<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<script>try { const t = localStorage.getItem("lp-theme"); if (t === "dark" || t === "light") document.documentElement.dataset.theme = t; } catch (e) {}</script>
	<script>(() => { let l = ""; try { l = localStorage.getItem("lp-lang") || ""; } catch (e) {} if (l !== "fr" && l !== "en") l = /^fr/i.test(navigator.language || "") ? "fr" : "en"; document.documentElement.lang = l; })();</script>
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Reset your password – Little Post</title>
	<meta name="description" content="Get a link to choose a new Little Post password.">
	<meta name="robots" content="noindex">
	<meta name="theme-color" content="#fff7ec">
	<link rel="icon" href="res/favicon.svg" type="image/svg+xml">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Gaegu:wght@400;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="css/common.css">
	<link rel="stylesheet" href="css/shop.css">
	<link rel="stylesheet" href="css/site.css">
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header id="siteHeader"></header>

<main id="main">
	<div class="auth">
	<div class="auth-art" aria-hidden="true" id="authArt">
		<p class="hand">Cards you love, kept in one cosy place.</p>
	</div>
		<section class="auth-card" aria-labelledby="t">
			<h1 id="t">Forgot your password?</h1>
			<p>Tell us your email and we'll send you a link to choose a new one.</p>
			<div class="notice" id="setupNotice" hidden><div><strong>Accounts aren't switched on yet.</strong> The shop owner needs to connect Supabase first (see the README).</div></div>
			<form id="forgotForm" novalidate>
				<div class="field"><label for="email">Email address</label><input id="email" type="email" autocomplete="email" inputmode="email" required><span class="err" id="eEmail" hidden></span></div>
				<p class="error" id="formError" role="alert" hidden></p>
				<button class="btn" type="submit" id="submit">Send me a link</button>
			</form>
			<div id="done" hidden></div>
			<p class="alt"><a href="login.html">← Back to log in</a></p>
		</section>
	</div>
</main>

<footer id="siteFooter"></footer>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="js/i18n.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="js/config.js"></script>
<script src="path.js"></script>
<script src="js/app.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
